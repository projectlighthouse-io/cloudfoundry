[package]
name = "auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Know who the current user is, and guard routes"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
password = { path = "../password" }
route = { path = "../route" }
serde = "1"
securecookie = { path = "../securecookie" }
serde_json = "1"
sha2 = "0.10"
session = { path = "../session", features = ["route"] }
throttle = { path = "../throttle", optional = true }
tokio = { version = "1", features = ["sync", "rt"] }
tower = "0.5"
tracing = "0.1"

[features]
# `AuthLayer::throttle(limiter)`: limit failed login attempts.
throttle = ["dep:throttle"]

[dev-dependencies]
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
http-body-util = "0.1"
securecookie = { path = "../securecookie" }
throttle = { path = "../throttle" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.art.publish]
"stubs/users.rs" = "src/users.rs"
"stubs/handlers/login.rs" = "src/handlers/login.rs"
"stubs/requests/login.rs" = "src/requests/login.rs"
"stubs/handlers/register.rs" = "src/handlers/register.rs"
"stubs/requests/register.rs" = "src/requests/register.rs"
"stubs/handlers/password_reset.rs" = "src/handlers/password_reset.rs"
"stubs/requests/password_reset.rs" = "src/requests/password_reset.rs"
"stubs/handlers/password.rs" = "src/handlers/password.rs"
"stubs/requests/password.rs" = "src/requests/password.rs"
"stubs/migrations/create_users.up.sql" = "migrations/{timestamp}_create_users.up.sql"
"stubs/migrations/create_users.down.sql" = "migrations/{timestamp}_create_users.down.sql"

[package.metadata.art.publish-sqlite]
"stubs/sqlite/users.rs" = "src/users.rs"
"stubs/handlers/login.rs" = "src/handlers/login.rs"
"stubs/requests/login.rs" = "src/requests/login.rs"
"stubs/handlers/register.rs" = "src/handlers/register.rs"
"stubs/requests/register.rs" = "src/requests/register.rs"
"stubs/handlers/password_reset.rs" = "src/handlers/password_reset.rs"
"stubs/requests/password_reset.rs" = "src/requests/password_reset.rs"
"stubs/handlers/password.rs" = "src/handlers/password.rs"
"stubs/requests/password.rs" = "src/requests/password.rs"
"stubs/sqlite/migrations/create_users.up.sql" = "migrations/{timestamp}_create_users.up.sql"
"stubs/sqlite/migrations/create_users.down.sql" = "migrations/{timestamp}_create_users.down.sql"

[package.metadata.art.publish-mysql]
"stubs/mysql/users.rs" = "src/users.rs"
"stubs/handlers/login.rs" = "src/handlers/login.rs"
"stubs/requests/login.rs" = "src/requests/login.rs"
"stubs/handlers/register.rs" = "src/handlers/register.rs"
"stubs/requests/register.rs" = "src/requests/register.rs"
"stubs/handlers/password_reset.rs" = "src/handlers/password_reset.rs"
"stubs/requests/password_reset.rs" = "src/requests/password_reset.rs"
"stubs/handlers/password.rs" = "src/handlers/password.rs"
"stubs/requests/password.rs" = "src/requests/password.rs"
"stubs/mysql/migrations/create_users.up.sql" = "migrations/{timestamp}_create_users.up.sql"
"stubs/mysql/migrations/create_users.down.sql" = "migrations/{timestamp}_create_users.down.sql"

# `art publish auth --with-ui`: Inertia handlers and Vue pages. Entries are
# added to the driver's table; one with the same destination replaces it.
[package.metadata.art.with-ui]
"stubs/ui/handlers/login.rs" = "src/handlers/login.rs"
"stubs/ui/handlers/register.rs" = "src/handlers/register.rs"
"stubs/ui/handlers/password_reset.rs" = "src/handlers/password_reset.rs"
"stubs/ui/handlers/password.rs" = "src/handlers/password.rs"
"stubs/pages/login.vue" = "resources/js/pages/auth/login.vue"
"stubs/pages/register.vue" = "resources/js/pages/auth/register.vue"
"stubs/pages/forgot-password.vue" = "resources/js/pages/auth/forgot-password.vue"
"stubs/pages/reset-password.vue" = "resources/js/pages/auth/reset-password.vue"
"stubs/pages/settings/password.vue" = "resources/js/pages/settings/password.vue"

[package.metadata.art]
agents = """
- Users: `src/users.rs` implements `auth::Provider`, `Credentials`, `Remember`, `Tokens` and `Resets` with sqlx.
- Log in with `auth.attempt(&users, email, password, remember)` in `src/handlers/login.rs`; it throttles, verifies, rehashes and logs in. Use `auth.login(&user)` for a user you already have.
- Guard routes with `auth::require::<User>()` in a route group; take `Authed<User>` in handlers that need a user, `Auth<User>` when it is optional.
- `auth::layer(...)` goes after the session and CSRF layers in `src/main.rs`.
- Docs: https://toolkit.projectlighthouse.io/docs/modules/auth.md"""
notes = """
Add `features = ["throttle"]` to `auth`, and the dependency `throttle = { <same source as auth> }`, then:

  src/main.rs           mod users;
                        .layer(auth::layer(users::Users { db: app.db.clone() })   // after the session and csrf layers
                            .throttle(throttle::Limiter::memory(throttle::FixedWindow::new(5, Duration::from_secs(60)))))
                        // "remember me": add .remember(Codec::new(Keys::parse(&key)?))
  src/handlers/mod.rs   pub mod login; pub mod password; pub mod password_reset; pub mod register;
  src/requests/mod.rs   pub mod login; pub mod password; pub mod password_reset; pub mod register;
  src/routes.rs         r.post("/login", handlers::login::login).name("login");
                        r.post("/logout", handlers::login::logout).name("logout");
                        r.post("/register", handlers::register::store).name("register");
                        r.post("/forgot-password", handlers::password_reset::email).name("password.email");
                        r.post("/reset-password", handlers::password_reset::update).name("password.update");
                        r.group("/settings", |r| {
                            r.layer(auth::require::<users::User>());
                            r.post("/password", handlers::password::update).name("password.change");
                        });

Then run `art migrate`. Reset links are logged until you send them by mail
(`send_reset_link` in src/handlers/password_reset.rs); set APP_URL to your frontend."""
with-ui-notes = """
Add `features = ["throttle"]` to `auth`, and the dependency `throttle = { <same source as auth> }`, then:

  src/main.rs           mod users;
                        .layer(auth::layer(users::Users { db: app.db.clone() })   // after the session and csrf layers
                            .throttle(throttle::Limiter::memory(throttle::FixedWindow::new(5, Duration::from_secs(60)))))
                        // "remember me": add .remember(Codec::new(Keys::parse(&key)?))
  src/handlers/mod.rs   pub mod login; pub mod password; pub mod password_reset; pub mod register;
  src/requests/mod.rs   pub mod login; pub mod password; pub mod password_reset; pub mod register;
  src/routes.rs         r.get("/login", handlers::login::show).name("login");
                        r.post("/login", handlers::login::login).name("login.store");
                        r.post("/logout", handlers::login::logout).name("logout");
                        r.get("/register", handlers::register::show).name("register");
                        r.post("/register", handlers::register::store).name("register.store");
                        r.get("/forgot-password", handlers::password_reset::request).name("password.request");
                        r.post("/forgot-password", handlers::password_reset::email).name("password.email");
                        r.get("/reset-password/{token}", handlers::password_reset::edit).name("password.reset");
                        r.post("/reset-password", handlers::password_reset::update).name("password.update");
                        r.group("/settings", |r| {
                            r.layer(auth::require::<users::User>());
                            r.get("/password", handlers::password::edit).name("password.edit");
                            r.post("/password", handlers::password::update).name("password.change");
                        });

Then run `art migrate`. Reset links are logged until you send them by mail
(`send_reset_link` in src/handlers/password_reset.rs); set APP_URL for the link."""

[lints]
workspace = true

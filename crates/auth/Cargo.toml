[package]
name = "auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Know who the current user is, and guard routes"

[dependencies]
route = { path = "../route" }
serde = "1"
serde_json = "1"
session = { path = "../session", features = ["route"] }
tokio = { version = "1", features = ["sync"] }
tower = "0.5"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
securecookie = { path = "../securecookie" }
tokio = { version = "1", features = ["macros", "rt"] }

[package.metadata.art.publish]
"stubs/users.rs" = "src/users.rs"
"stubs/handlers/login.rs" = "src/handlers/login.rs"
"stubs/requests/login.rs" = "src/requests/login.rs"
"stubs/pages/login.vue" = "resources/js/pages/auth/login.vue"
"stubs/migrations/create_users.up.sql" = "migrations/{timestamp}_create_users.up.sql"
"stubs/migrations/create_users.down.sql" = "migrations/{timestamp}_create_users.down.sql"

[package.metadata.art]
notes = """
Add the dependency `password = { <same source as auth> }`, then:

  src/main.rs           mod users;
                        .layer(auth::layer(users::Users { db: app.db.clone() }))   // after the session and csrf layers
  src/handlers/mod.rs   pub mod login;
  src/requests/mod.rs   pub mod login;
  src/routes.rs         r.get("/login", handlers::login::show).name("login");
                        r.post("/login", handlers::login::login).name("login.store");
                        r.post("/logout", handlers::login::logout).name("logout");

Then run `art migrate`."""

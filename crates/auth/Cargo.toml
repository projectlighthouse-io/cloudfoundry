[package]
name = "auth"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Know who the current user is, and guard routes"

[dependencies]
configured = { path = "../configured", default-features = false, optional = true }
base64 = "0.22"
getrandom = "0.3"
password = { path = "../password" }
route = { path = "../route" }
serde = "1"
securecookie = { path = "../securecookie" }
serde_json = "1"
sha2 = "0.10"
session = { path = "../session", features = ["route"] }
throttle = { path = "../throttle", optional = true }
event = { path = "../event", optional = true }
tokio = { version = "1", features = ["sync", "rt"] }
tower = "0.5"
tracing = "0.1"
uuid = { version = "1.10", features = ["serde"] }

[features]
# `AuthLayer::throttle(limiter)`: limit failed login attempts.
throttle = ["dep:throttle"]
# `AuthLayer::events(events, cx)`: emit `auth::events::*` on the `event` bus.
event = ["dep:event"]
# `Config` deserializes through `configured` (durations as "2h", "14d").
configured = ["dep:configured"]

[dev-dependencies]
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
http-body-util = "0.1"
securecookie = { path = "../securecookie" }
throttle = { path = "../throttle" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
toml = "0.9"


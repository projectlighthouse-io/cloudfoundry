[package]
name = "mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Send mail: SMTP, the log, or memory for tests"

[dependencies]
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
tracing = "0.1"

configured = { path = "../configured", default-features = false, optional = true }

[features]
# `Config` deserializes through `configured` (`url` is a secret: it may hold a password).
configured = ["dep:configured"]

[dev-dependencies]
configured = { path = "../configured" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[package.metadata.art.publish]
"stubs/mailer.rs" = "src/mailer.rs"

[package.metadata.art]
agents = """
- Mail (`mail`): `crate::mailer::mailer(&app)` is the app's one `mail::Mailer`, built from `[mail]` in config (`url`: `smtp://user:pass@host:587?tls=required`, `smtps://...`, `log`, or `memory`; `from`). Send with `mailer.send(mail::Message::new(to, subject, text)).await`; `.html(...)` adds an HTML part.
- The `log` driver (the default) writes each mail to the log: development only, links in it are live. Tests use `memory` and read `mailer.sent()`.
- Mail is sent in the request; move it to a job (`art make:job`) when SMTP latency matters.
- Docs: https://toolkit.projectlighthouse.io/docs/crates/mail.md"""
notes = """
Add the dependency `mail = { <same source as the other crates>, features = ["configured"] }`, then:

  src/main.rs           mod mailer;
  src/config.rs         #[serde(default)]
                        pub mail: mail::Config,
  config/default.toml   [mail]
                        url = "secret_env(MAIL_URL, log)"   # smtp://user:pass@host:587?tls=required, smtps://..., log, memory
                        from = "env(MAIL_FROM, hello@example.test)"

Locally, Mailpit catches everything: `docker run -p 1025:1025 -p 8025:8025 axllent/mailpit`,
MAIL_URL=smtp://127.0.0.1:1025, and read the mail at http://localhost:8025."""

[lints]
workspace = true

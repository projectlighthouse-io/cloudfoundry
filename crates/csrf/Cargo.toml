[package]
name = "csrf"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Issue and verify CSRF tokens"

[dependencies]
configured = { path = "../configured", default-features = false, optional = true }
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_urlencoded = "0.7"
tower = "0.5"
tracing = "0.1"

route = { path = "../route", optional = true }

[features]
# `except([...])`: exempt routes by name.
route = ["dep:route"]
# `Config` deserializes through `configured` (durations as "2h", "14d").
configured = ["dep:configured"]

[dev-dependencies]
route = { path = "../route" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.9"

[lints]
workspace = true

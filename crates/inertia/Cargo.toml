[package]
name = "inertia"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Speak the Inertia.js v3 protocol"

[dependencies]
route = { path = "../route" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tower = "0.5"
tracing = "0.1"

session = { path = "../session", optional = true }
validate = { path = "../validate", optional = true }

[features]
# On an Inertia visit, a validation failure redirects back and the errors
# arrive as `props.errors` on the next page (flashed through the session).
validate = ["dep:validate", "dep:session"]

[dev-dependencies]
http-body-util = "0.1"
securecookie = { path = "../securecookie" }
session = { path = "../session", features = ["route"] }
tokio = { version = "1", features = ["macros", "rt"] }
validate = { path = "../validate", features = ["route"] }

[package]
name = "teams"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Organizations and teams, with typed roles and permissions"

[dependencies]
base64 = "0.22"
db = { path = "../db", features = ["uuid"] }
getrandom = "0.3"
route = { path = "../route" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tower = "0.5"
tracing = "0.1"

auth = { path = "../auth", optional = true }
session = { path = "../session", features = ["route"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "uuid"], optional = true }
ts-rs = { version = "12", optional = true }

[features]
# SQL stores. Publish the tables with `art publish teams [--driver sqlite|mysql]`.
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql"]
# `teams::auth_user`: take the user id from the `auth` crate's logged-in user.
auth = ["dep:auth"]
# `CurrentTeam`: the team a user last switched to, kept in the session.
session = ["dep:session"]
# `ts_rs::TS` for `Team` and `Org` (`{ uuid: Uuid<"Team">, name: string }`), for page prop types.
ts = ["dep:ts-rs", "db/ts"]

[dev-dependencies]
http-body-util = "0.1"
securecookie = { path = "../securecookie" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.art.publish]
"stubs/access.rs" = "src/access.rs"
"stubs/handlers/team.rs" = "src/handlers/team.rs"
"stubs/handlers/organization.rs" = "src/handlers/organization.rs"
"stubs/handlers/invitation.rs" = "src/handlers/invitation.rs"
"stubs/requests/team.rs" = "src/requests/team.rs"
"stubs/migrations/create_teams.up.sql" = "migrations/{timestamp}_create_teams.up.sql"
"stubs/migrations/create_teams.down.sql" = "migrations/{timestamp}_create_teams.down.sql"
"stubs/migrations/add_current_team.up.sql" = "migrations/{timestamp}_add_current_team_to_users.up.sql"
"stubs/migrations/add_current_team.down.sql" = "migrations/{timestamp}_add_current_team_to_users.down.sql"

[package.metadata.art.publish-sqlite]
"stubs/sqlite/access.rs" = "src/access.rs"
"stubs/handlers/team.rs" = "src/handlers/team.rs"
"stubs/handlers/organization.rs" = "src/handlers/organization.rs"
"stubs/handlers/invitation.rs" = "src/handlers/invitation.rs"
"stubs/requests/team.rs" = "src/requests/team.rs"
"stubs/migrations/sqlite/create_teams.up.sql" = "migrations/{timestamp}_create_teams.up.sql"
"stubs/migrations/create_teams.down.sql" = "migrations/{timestamp}_create_teams.down.sql"
"stubs/migrations/add_current_team.up.sql" = "migrations/{timestamp}_add_current_team_to_users.up.sql"
"stubs/migrations/add_current_team.down.sql" = "migrations/{timestamp}_add_current_team_to_users.down.sql"

[package.metadata.art.publish-mysql]
"stubs/mysql/access.rs" = "src/access.rs"
"stubs/handlers/team.rs" = "src/handlers/team.rs"
"stubs/handlers/organization.rs" = "src/handlers/organization.rs"
"stubs/handlers/invitation.rs" = "src/handlers/invitation.rs"
"stubs/requests/team.rs" = "src/requests/team.rs"
"stubs/migrations/mysql/create_teams.up.sql" = "migrations/{timestamp}_create_teams.up.sql"
"stubs/migrations/create_teams.down.sql" = "migrations/{timestamp}_create_teams.down.sql"
"stubs/migrations/add_current_team.up.sql" = "migrations/{timestamp}_add_current_team_to_users.up.sql"
"stubs/migrations/add_current_team.down.sql" = "migrations/{timestamp}_add_current_team_to_users.down.sql"

# `art publish teams --with-ui`: Inertia handlers and Vue pages. Entries are
# added to the driver's table; one with the same destination replaces it.
[package.metadata.art.with-ui]
"stubs/ui/handlers/team.rs" = "src/handlers/team.rs"
"stubs/ui/handlers/organization.rs" = "src/handlers/organization.rs"
"stubs/ui/handlers/invitation.rs" = "src/handlers/invitation.rs"
"stubs/pages/teams/index.vue" = "resources/js/pages/teams/index.vue"
"stubs/pages/teams/show.vue" = "resources/js/pages/teams/show.vue"
"stubs/pages/organizations/index.vue" = "resources/js/pages/organizations/index.vue"
"stubs/pages/organizations/show.vue" = "resources/js/pages/organizations/show.vue"
"stubs/pages/invitations/show.vue" = "resources/js/pages/invitations/show.vue"
"stubs/components/TeamMembers.vue" = "resources/js/components/TeamMembers.vue"
"stubs/components/TeamSettings.vue" = "resources/js/components/TeamSettings.vue"
# What `cargo test export_bindings` (`art dev`) writes from the handlers' `#[ts(export)]` props.
"stubs/types/InvitationItem.ts" = "resources/js/types/InvitationItem.ts"
"stubs/types/InvitationPage.ts" = "resources/js/types/InvitationPage.ts"
"stubs/types/MemberItem.ts" = "resources/js/types/MemberItem.ts"
"stubs/types/Org.ts" = "resources/js/types/Org.ts"
"stubs/types/OrgAbilities.ts" = "resources/js/types/OrgAbilities.ts"
"stubs/types/OrgItem.ts" = "resources/js/types/OrgItem.ts"
"stubs/types/OrgPage.ts" = "resources/js/types/OrgPage.ts"
"stubs/types/OrgRole.ts" = "resources/js/types/OrgRole.ts"
"stubs/types/OrgsPage.ts" = "resources/js/types/OrgsPage.ts"
"stubs/types/SentLink.ts" = "resources/js/types/SentLink.ts"
"stubs/types/Team.ts" = "resources/js/types/Team.ts"
"stubs/types/TeamAbilities.ts" = "resources/js/types/TeamAbilities.ts"
"stubs/types/TeamItem.ts" = "resources/js/types/TeamItem.ts"
"stubs/types/TeamPage.ts" = "resources/js/types/TeamPage.ts"
"stubs/types/TeamRole.ts" = "resources/js/types/TeamRole.ts"
"stubs/types/TeamsPage.ts" = "resources/js/types/TeamsPage.ts"

[package.metadata.art]
agents = """
- Roles (`TeamRole`, `OrgRole`) and permissions (unit structs with `teams::Grants` impls) live in `src/access.rs`. Add a permission there, then take `Can<MyPermission, TeamRole>` (or `OrgCan<_, OrgRole>`) in the handler: it is `404` for non-members and `403` without the permission.
- Page props are Rust structs deriving `ts_rs::TS` (`#[ts(export)]`) in `src/handlers/{team,organization,invitation}.rs`; the Vue pages import the generated types from `resources/js/types/`. Change a prop in Rust, then `art dev` (or `cargo test export_bindings`) regenerates them. `Team` and `Org` get `TS` from teams feature `ts`.
- Routes name their team by `uuid` (`teams::Uuid<Team>`), never by the internal `id` (which is `#[serde(skip)]`): `/teams/{team}/...`, `/organizations/{org}/...`. `Membership<TeamRole>` loads `{team}` for any member; `CurrentTeam<TeamRole>` is the team to land on.
- `CurrentTeam` is stored in `users.current_team_id` and cached in the session; `current.set(&membership).await` switches. Teams are required (`require_team` in `src/access.rs`): a user without one gets a personal team, and `Error::LastTeam` stops them leaving their last; call `keeps_a_team` before deleting a team or organization.
- Before `invite`, call `access::not_a_member` (the store has no emails). One pending invitation per email (`AlreadyInvited`); `resend_team_invitation` / `resend_org_invitation` issue a new link.
- Change teams through `access::teams(&cx.db)` (`create_team`, `add_member`, `change_role`, `invite`, `accept`, ...): it enforces the last-owner and org-membership rules. Map its errors with `access::failed`.
- Docs: https://toolkit.projectlighthouse.io/docs/modules/teams.md"""
notes = """
Add the dependency `teams = { <same source as auth>, features = ["<driver>", "auth", "session"] }`
(`<driver>` is sqlite, postgres or mysql), then:

  src/main.rs           mod access;
                        .layer(teams::layer(access::teams(&app.db), teams::auth_user(|u: &users::User| u.id)))   // after auth::layer
  src/handlers/mod.rs   pub mod invitation; pub mod organization; pub mod team;
  src/requests/mod.rs   pub mod team;
  src/routes.rs         r.group("", |r| {
                            r.layer(auth::require::<users::User>());
                            r.get("/teams", handlers::team::index).name("teams");
                            r.post("/teams", handlers::team::store).name("teams.store");
                            r.get("/teams/{team}", handlers::team::show).name("teams.show");
                            r.put("/teams/{team}", handlers::team::update).name("teams.update");
                            r.delete("/teams/{team}", handlers::team::destroy).name("teams.destroy");
                            r.post("/teams/{team}/switch", handlers::team::switch).name("teams.switch");
                            r.delete("/teams/{team}/membership", handlers::team::leave).name("teams.leave");
                            r.put("/teams/{team}/members/{user}", handlers::team::update_member).name("teams.members.update");
                            r.delete("/teams/{team}/members/{user}", handlers::team::remove_member).name("teams.members.destroy");
                            r.post("/teams/{team}/invitations", handlers::team::invite).name("teams.invitations.store");
                            r.delete("/teams/{team}/invitations/{invitation}", handlers::team::revoke).name("teams.invitations.destroy");
                            r.post("/teams/{team}/invitations/{invitation}/resend", handlers::team::resend).name("teams.invitations.resend");
                            r.get("/organizations", handlers::organization::index).name("organizations");
                            r.post("/organizations", handlers::organization::store).name("organizations.store");
                            r.get("/organizations/{org}", handlers::organization::show).name("organizations.show");
                            r.put("/organizations/{org}", handlers::organization::update).name("organizations.update");
                            r.delete("/organizations/{org}", handlers::organization::destroy).name("organizations.destroy");
                            r.delete("/organizations/{org}/membership", handlers::organization::leave).name("organizations.leave");
                            r.put("/organizations/{org}/members/{user}", handlers::organization::update_member).name("organizations.members.update");
                            r.delete("/organizations/{org}/members/{user}", handlers::organization::remove_member).name("organizations.members.destroy");
                            r.post("/organizations/{org}/invitations", handlers::organization::invite).name("organizations.invitations.store");
                            r.delete("/organizations/{org}/invitations/{invitation}", handlers::organization::revoke).name("organizations.invitations.destroy");
                            r.post("/organizations/{org}/invitations/{invitation}/resend", handlers::organization::resend).name("organizations.invitations.resend");
                            r.post("/invitations/{token}", handlers::invitation::accept).name("invitations.accept");
                        });

Then run `art migrate` (it adds `users.current_team_id`; publish auth first). Every user
gets a personal team unless you drop `.require_team(...)` in src/access.rs. Roles and
permissions are in src/access.rs. Invitation
links are logged until you send them by mail (`send_invitation` in src/access.rs)."""

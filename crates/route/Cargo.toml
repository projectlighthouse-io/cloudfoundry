[package]
name = "route"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Match a request to a handler"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
matchit = "0.8"
percent-encoding = "2"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1"

action = { path = "../action", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"], optional = true }
tokio = { version = "1", features = ["net", "rt", "time"], optional = true }

[features]
# `serve(listener, routes)` over hyper.
server = ["dep:hyper", "dep:hyper-util", "dep:tokio"]
# `route::command::{list, serve}` for the `command` crate. Needs no dependency on it.
command = ["dep:clap"]
# `route::action(a)` turns an `Action` into a handler.
action = ["dep:action"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

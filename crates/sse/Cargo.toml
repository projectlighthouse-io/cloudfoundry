[package]
name = "sse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Server-sent event responses"

[dependencies]
bytes = "1"
futures-core = "0.3"
http = "1"
http-body = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

route = { path = "../route", optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
# `Sse` as a handler output, `LastEventId` as an input.
route = ["dep:route", "dep:http-body-util"]

[dev-dependencies]
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
tokio-stream = "0.1"

[package]
name = "throttle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rate limit anything per key, with a choice of algorithm"

[dependencies]
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

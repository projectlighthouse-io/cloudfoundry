[package]
name = "throttle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rate limit anything per key, with a choice of algorithm"

[dependencies]
tokio = { version = "1", features = ["time"] }

clap = { version = "4", features = ["derive"], optional = true }
route = { path = "../route", optional = true }
tower = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }

[features]
# SQL stores, for limits shared by several servers.
# Publish the table with `art publish throttle [--driver sqlite|mysql]`.
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql"]
# `throttle::layer`: route middleware answering `429` with `Retry-After`.
route = ["dep:route", "dep:tower", "dep:tracing"]
# `throttle::command::prune` for `throttle:prune`.
command = ["dep:clap"]

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[package.metadata.art.publish]
"stubs/migrations/create_throttle.up.sql" = "migrations/{timestamp}_create_throttle.up.sql"
"stubs/migrations/create_throttle.down.sql" = "migrations/{timestamp}_create_throttle.down.sql"

[package.metadata.art.publish-sqlite]
"stubs/migrations/sqlite/create_throttle.up.sql" = "migrations/{timestamp}_create_throttle.up.sql"
"stubs/migrations/create_throttle.down.sql" = "migrations/{timestamp}_create_throttle.down.sql"

[package.metadata.art.publish-mysql]
"stubs/migrations/mysql/create_throttle.up.sql" = "migrations/{timestamp}_create_throttle.up.sql"
"stubs/migrations/create_throttle.down.sql" = "migrations/{timestamp}_create_throttle.down.sql"

[package.metadata.art]
notes = "Run `art migrate` to create the throttle table. Prune expired keys with `throttle:prune` (feature `command`)."

[package]
name = "socialite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OAuth login with third-party providers"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
session = { path = "../session" }
sha2 = "0.10"
serde_json = { version = "1", optional = true }

[features]
# One feature per provider; enable only what the app uses.
github = []
gitlab = []
google = []
reddit = []
twitter = []
# Any OpenID Connect provider (discovery or explicit endpoints).
oidc = ["dep:serde_json"]
auth0 = ["oidc"]

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
route = { path = "../route", features = ["server"] }
securecookie = { path = "../securecookie" }
session = { path = "../session", features = ["route"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }

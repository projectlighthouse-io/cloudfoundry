[package]
name = "socialite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OAuth login with third-party providers"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
session = { path = "../session" }
sha2 = "0.10"
serde_json = { version = "1", optional = true }
route = { path = "../route", optional = true }

[features]
# One feature per provider; enable only what the app uses.
github = []
gitlab = []
google = []
reddit = []
twitter = []
# Any OpenID Connect provider (discovery or explicit endpoints).
oidc = ["dep:serde_json"]
auth0 = ["oidc"]
# `socialite::routes(r, provider, callback)` and the `SocialCallback` input.
route = ["dep:route", "session/route"]

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
route = { path = "../route", features = ["server"] }
securecookie = { path = "../securecookie" }
session = { path = "../session", features = ["route"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }

[package.metadata.art.publish]
"stubs/migrations/create_social_accounts.up.sql" = "migrations/{timestamp}_create_social_accounts.up.sql"
"stubs/migrations/create_social_accounts.down.sql" = "migrations/{timestamp}_create_social_accounts.down.sql"
"stubs/migrations/allow_null_passwords.up.sql" = "migrations/{timestamp}_allow_null_passwords.up.sql"
"stubs/migrations/allow_null_passwords.down.sql" = "migrations/{timestamp}_allow_null_passwords.down.sql"
"stubs/social.rs" = "src/social.rs"
"stubs/handlers/social.rs" = "src/handlers/social.rs"

[package.metadata.art.publish-sqlite]
"stubs/sqlite/migrations/create_social_accounts.up.sql" = "migrations/{timestamp}_create_social_accounts.up.sql"
"stubs/sqlite/migrations/create_social_accounts.down.sql" = "migrations/{timestamp}_create_social_accounts.down.sql"
"stubs/sqlite/migrations/allow_null_passwords.up.sql" = "migrations/{timestamp}_allow_null_passwords.up.sql"
"stubs/sqlite/migrations/allow_null_passwords.down.sql" = "migrations/{timestamp}_allow_null_passwords.down.sql"
"stubs/sqlite/social.rs" = "src/social.rs"
"stubs/handlers/social.rs" = "src/handlers/social.rs"

[package.metadata.art.publish-mysql]
"stubs/mysql/migrations/create_social_accounts.up.sql" = "migrations/{timestamp}_create_social_accounts.up.sql"
"stubs/mysql/migrations/create_social_accounts.down.sql" = "migrations/{timestamp}_create_social_accounts.down.sql"
"stubs/mysql/migrations/allow_null_passwords.up.sql" = "migrations/{timestamp}_allow_null_passwords.up.sql"
"stubs/mysql/migrations/allow_null_passwords.down.sql" = "migrations/{timestamp}_allow_null_passwords.down.sql"
"stubs/mysql/social.rs" = "src/social.rs"
"stubs/handlers/social.rs" = "src/handlers/social.rs"

# `--with-ui`: an Inertia callback that reports errors on the login page, and the buttons.
[package.metadata.art.with-ui]
"stubs/ui/handlers/social.rs" = "src/handlers/social.rs"
"stubs/components/SocialButtons.vue" = "resources/js/components/SocialButtons.vue"

[package.metadata.art]
agents = """
- Each provider is a Cargo feature (`google`, `github`, ...) plus `route`; `socialite::routes(&mut r, provider, handlers::social::callback)` adds `/auth/{provider}` and its callback.
- Account linking lives in `src/social.rs` (`Users::find_or_create_social`): it links by email only when the provider verified it. Keep `TRUST_UNVERIFIED_EMAILS = false`.
- Docs: https://toolkit.projectlighthouse.io/docs/modules/socialite.md"""
notes = """
Needs `auth` published first (it extends src/users.rs). Enable the route feature and your providers:
  socialite = { <source>, features = ["route", "google", "github"] }

  src/main.rs           mod social;
                        let mut r = routes::register(Router::new());
                        if let (Ok(id), Ok(secret)) = (std::env::var("GOOGLE_CLIENT_ID"), std::env::var("GOOGLE_CLIENT_SECRET")) {
                            let cb = format!("{}/auth/google/callback", std::env::var("APP_URL").unwrap_or_default());
                            socialite::routes(&mut r, socialite::Google::new(id, secret, cb), handlers::social::callback);
                        }
                        // ... the same per provider; then .layer(...) and .build(...) on `r`
  src/handlers/mod.rs   pub mod social;

`socialite::routes` adds GET /auth/{provider} and /auth/{provider}/callback.
The migrations add `social_accounts` and make `users.password_hash` nullable:
social-only accounts have no password until they set one with "forgot password".
Then run `art migrate`."""
with-ui-notes = """
Needs `auth --with-ui` published first. Enable the route feature and your providers:
  socialite = { <source>, features = ["route", "google", "github"] }

  src/main.rs           mod social;
                        let mut r = routes::register(Router::new());
                        let mut enabled: Vec<&'static str> = Vec::new();
                        if let (Ok(id), Ok(secret)) = (std::env::var("GOOGLE_CLIENT_ID"), std::env::var("GOOGLE_CLIENT_SECRET")) {
                            let cb = format!("{}/auth/google/callback", std::env::var("APP_URL").unwrap_or_default());
                            socialite::routes(&mut r, socialite::Google::new(id, secret, cb), handlers::social::callback);
                            enabled.push("google");
                        }
                        // ... the same per provider; then share the list with every page:
                        inertia::layer()...share(move |_| serde_json::json!({ "social": enabled.clone() }))
  src/handlers/mod.rs   pub mod social;
  login/register pages  import SocialButtons from '../../components/SocialButtons.vue'  and  <SocialButtons />

`socialite::routes` adds GET /auth/{provider} and /auth/{provider}/callback.
The migrations add `social_accounts` and make `users.password_hash` nullable:
social-only accounts have no password until they set one with "forgot password".
Then run `art migrate`."""

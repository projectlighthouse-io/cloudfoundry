[package]
name = "queue"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Persist, claim, run and retry jobs"

[dependencies]
configured = { path = "../configured", default-features = false, optional = true }
action = { path = "../action", optional = true }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "signal"] }
tracing = "0.1"

clap = { version = "4", features = ["derive"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"], optional = true }

[features]
# SQL stores. Publish the tables with `art publish queue [--driver sqlite|mysql]`.
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
mysql = ["dep:sqlx", "sqlx/mysql"]
# `ActionJob`: an `Action` whose `Input` is serializable runs as a job.
action = ["dep:action"]
# `queue::command::{work, retry}` for the `command` crate.
command = ["dep:clap"]
# `WorkerConfig` deserializes through `configured` (durations as "2h", "14d").
configured = ["dep:configured"]

[dev-dependencies]
action = { path = "../action" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
toml = "0.9"

[package.metadata.art.publish]
"stubs/migrations/create_jobs.up.sql" = "migrations/{timestamp}_create_jobs.up.sql"
"stubs/migrations/create_jobs.down.sql" = "migrations/{timestamp}_create_jobs.down.sql"

[package.metadata.art.publish-sqlite]
"stubs/migrations/sqlite/create_jobs.up.sql" = "migrations/{timestamp}_create_jobs.up.sql"
"stubs/migrations/sqlite/create_jobs.down.sql" = "migrations/{timestamp}_create_jobs.down.sql"

[package.metadata.art.publish-mysql]
"stubs/migrations/mysql/create_jobs.up.sql" = "migrations/{timestamp}_create_jobs.up.sql"
"stubs/migrations/mysql/create_jobs.down.sql" = "migrations/{timestamp}_create_jobs.down.sql"

[package.metadata.art]
agents = """
- Jobs live in `src/jobs/` (`art make:job <name>`) and are registered in `src/jobs/mod.rs`; run workers with `queue:work`.
- Worker queues, concurrency and visibility: `[queue]` in config (`queue::WorkerConfig`, `worker.config(cfg.queue)?`).
- Docs: https://toolkit.projectlighthouse.io/docs/crates/queue.md"""
notes = "Run `art migrate` to create the jobs and failed_jobs tables."

[lints]
workspace = true
